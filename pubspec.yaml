name: huaxia_timeline
description: 华夏脉络，中国历史朝代时间轴与疆域资料浏览器。
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/history.json
    - assets/map-data/
    - assets/fonts/NOTO-LICENSE.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.otf
